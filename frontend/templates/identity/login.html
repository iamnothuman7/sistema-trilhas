{% extends "base.html" %}

{% block title %}Entrar na Conta | Equipe Morcego{% endblock %}

{% block content %}
<div class="container" style="max-width: 480px; padding: 4.5rem 1.25rem;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <span style="font-size: 2.5rem;">🦇</span>
            <h1 style="font-size: 1.8rem; font-weight: 900; color: #FFF; margin-top: 0.5rem;">Acesse sua Conta</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Acompanhe suas inscrições e acerte seu QR Code</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required placeholder="seu@email.com" autofocus>
            </div>

            <div class="form-group">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Entrar
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border); padding-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
            Ainda não tem conta? <a href="{% url 'identity:register' %}" style="font-weight: 700;">Cadastre-se grátis</a>
        </div>
    </div>
</div>
{% endblock %}
