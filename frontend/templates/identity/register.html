{% extends "base.html" %}

{% block title %}Criar Conta de Piloto | Equipe Morcego{% endblock %}

{% block content %}
<div class="container" style="max-width: 520px; padding: 4rem 1.25rem;">
    <div class="card">
        <div style="text-align: center; margin-bottom: 2rem;">
            <span style="font-size: 2.5rem;">🏍️</span>
            <h1 style="font-size: 1.8rem; font-weight: 900; color: #FFF; margin-top: 0.5rem;">Cadastro de Piloto</h1>
            <p style="color: var(--text-muted); font-size: 0.95rem;">Crie sua conta para gerenciar suas inscrições e termos</p>
        </div>

        <form method="POST">
            {% csrf_token %}
            <div class="form-group">
                <label class="form-label">Nome Completo</label>
                <input type="text" name="full_name" class="form-control" required placeholder="Ex: Kelvim Muniz">
            </div>

            <div class="form-group">
                <label class="form-label">E-mail</label>
                <input type="email" name="email" class="form-control" required placeholder="seu@email.com">
            </div>

            <div class="form-group">
                <label class="form-label">WhatsApp / Telefone</label>
                <input type="text" name="phone" class="form-control" required placeholder="(88) 99999-9999">
            </div>

            <div style="display: grid; grid-template-columns: 2fr 1fr; gap: 1rem;">
                <div class="form-group">
                    <label class="form-label">Cidade</label>
                    <input type="text" name="city" class="form-control" value="Tianguá">
                </div>
                <div class="form-group">
                    <label class="form-label">UF</label>
                    <input type="text" name="state" class="form-control" value="CE" maxlength="2">
                </div>
            </div>

            <div class="form-group">
                <label class="form-label">Senha (mínimo 8 caracteres)</label>
                <input type="password" name="password" class="form-control" required placeholder="••••••••" minlength="8">
            </div>

            <div class="form-group">
                <label class="form-label">Confirmar Senha</label>
                <input type="password" name="confirm_password" class="form-control" required placeholder="••••••••" minlength="8">
            </div>

            <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 1.5rem;">
                Concluir Cadastro
            </button>
        </form>

        <div style="text-align: center; margin-top: 1.75rem; border-top: 1px solid var(--border); padding-top: 1.25rem; font-size: 0.9rem; color: var(--text-muted);">
            Já possui cadastro? <a href="{% url 'identity:login' %}" style="font-weight: 700;">Fazer Login</a>
        </div>
    </div>
</div>
{% endblock %}
