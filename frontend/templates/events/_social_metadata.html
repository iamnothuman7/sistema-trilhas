{% if social %}
<meta property="og:type" content="website">
<meta property="og:locale" content="pt_BR">
<meta property="og:site_name" content="Equipe Morcego">
<meta property="og:url" content="{{ social.url }}">
<link rel="canonical" href="{{ social.url }}">
<meta property="og:title" content="{{ social.title }}">
<meta property="og:description" content="{{ social.description|striptags|truncatechars:200 }}">
<meta property="og:image" content="{{ social.image }}">
{% if request.is_secure %}<meta property="og:image:secure_url" content="{{ social.image }}">{% endif %}
<meta property="og:image:alt" content="{{ social.title }} — capa oficial">
<meta property="og:image:type" content="{{ social.image_type }}">
{% if social.width %}<meta property="og:image:width" content="{{ social.width }}">
<meta property="og:image:height" content="{{ social.height }}">{% endif %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ social.title }}">
<meta name="twitter:description" content="{{ social.description|striptags|truncatechars:200 }}">
<meta name="twitter:image" content="{{ social.image }}">
<meta name="twitter:image:alt" content="{{ social.title }} — capa oficial">
{% endif %}
