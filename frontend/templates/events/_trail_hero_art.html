{% load static %}
<div class="trail-hero-art{% if hero_banner %} trail-hero-art--custom{% endif %}" aria-hidden="true">
  {% if hero_banner %}
  <img src="{{ hero_banner.url }}" alt="" width="1536" height="1024" fetchpriority="high" decoding="async">
  {% else %}
  <picture><source media="(max-width: 700px)" srcset="{% static 'img/trail-hero-mobile-v2.webp' %}" width="768" height="1152"><img src="{% static 'img/trail-hero-desktop-v2.webp' %}" alt="" width="1536" height="1024" fetchpriority="high" decoding="async"></picture>
  {% endif %}
</div>
<div class="trail-hero-shade" aria-hidden="true"></div>
<div class="tire-track tire-track--hero" aria-hidden="true"></div>
<div class="trail-dust" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span></div>
<div class="trail-speed-lines" aria-hidden="true"><span></span><span></span><span></span></div>
