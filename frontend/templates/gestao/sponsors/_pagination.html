{% if page_obj.paginator.num_pages > 1 %}<nav class="mg-pagination" aria-label="Páginas de patrocinadores"><span>Página {{ page_obj.number }} de {{ page_obj.paginator.num_pages }}</span><div class="page-actions">{% if page_obj.has_previous %}<a class="btn btn-secondary" href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}&amp;page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-secondary" href="?q={{ q|urlencode }}&amp;status={{ status|urlencode }}&amp;page={{ page_obj.next_page_number }}">Próxima</a>{% endif %}</div></nav>{% endif %}
