{% if page_obj.paginator.num_pages > 1 %}<nav class="mg-pagination" aria-label="Páginas dos registros"><span>{{ page_obj.number }} / {{ page_obj.paginator.num_pages }}</span><div class="page-actions">{% if page_obj.has_previous %}<a class="btn btn-secondary" href="?q={{ q|urlencode }}&archived={% if archived %}1{% else %}0{% endif %}&page={{ page_obj.previous_page_number }}">Anterior</a>{% endif %}{% if page_obj.has_next %}<a class="btn btn-secondary" href="?q={{ q|urlencode }}&archived={% if archived %}1{% else %}0{% endif %}&page={{ page_obj.next_page_number }}">Próxima</a>{% endif %}</div></nav>{% endif %}
