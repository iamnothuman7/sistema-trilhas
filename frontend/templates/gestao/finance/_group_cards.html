{% load trilhas_ui %}
<section class="management-category-grid management-disclosure-grid" data-instant-groups="finance" data-group-scope="{{ event.id }}:{{ date_query }}" data-group-selected="{{ finance_selected_group }}" aria-label="Organizar financeiro">
  {% for group in finance_primary_panels %}
  <button type="button" class="management-category-card" data-category="{{ group.key }}" data-group-toggle="{{ group.key }}" aria-expanded="{{ group.is_open|yesno:'true,false' }}" aria-controls="finance-panel-{{ group.key }}">
    <span class="category-card-icon"><i data-lucide="{{ group.icon }}" aria-hidden="true"></i></span>
    <span class="category-card-title">{{ group.title }}</span>
    <strong class="category-card-count">{{ group.count }}<small>{% if group.kind == 'expenses' %}conta{{ group.count|pluralize }}{% else %}registro{{ group.count|pluralize }}{% endif %}</small></strong>
    <span class="category-card-description">{% if group.kind == 'expenses' %}R$ {{ group.total|default:0|money }}{% else %}Entradas e saídas válidas{% endif %}</span>
    <span class="category-card-link"><span data-group-label data-group-collapsed-label="{{ group.label }}">{% if group.is_open %}Recolher{% else %}{{ group.label }}{% endif %}</span><i data-lucide="chevron-down" aria-hidden="true"></i></span>
  </button>
  {% include 'gestao/finance/_group_panel.html' %}
  {% endfor %}
  <nav class="management-group-tools" aria-label="Outras consultas do financeiro">
    {% for group in finance_aux_panels %}
    <button type="button" data-group-toggle="{{ group.key }}" aria-expanded="{{ group.is_open|yesno:'true,false' }}" aria-controls="finance-panel-{{ group.key }}">{{ group.title }}{% if group.key == 'CANCELED' %} <span>{{ group.count }}</span>{% endif %}</button>
    {% endfor %}
  </nav>
  {% for group in finance_aux_panels %}{% include 'gestao/finance/_group_panel.html' %}{% endfor %}
</section>
