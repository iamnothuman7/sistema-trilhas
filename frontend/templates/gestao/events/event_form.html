{% extends "gestao/base_gestao.html" %}

{% block title %}Criar Novo Evento | Painel Gestão{% endblock %}
{% block gestao_header %}Cadastro de Nova Edição de Evento{% endblock %}

{% block content %}
<div class="card mg-form-sheet">
    <h2 class="section-title">
        Nova Edição de Evento
    </h2>

    <form method="POST">
        {% csrf_token %}
        <div class="form-group">
            <label class="form-label" for="field-title">Nome Oficial do Evento *</label>
            <input type="text" name="title" class="form-control" required placeholder="Ex: 3º Trilhão Tianguá Off Road" id="field-title">
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="field-slug">Identificador na URL (Slug) *</label>
                <input type="text" name="slug" class="form-control" required placeholder="ex: 3-trilhao-tiangua" id="field-slug">
            </div>
            <div class="form-group">
                <label class="form-label" for="field-edition_number">Número da Edição *</label>
                <input type="number" name="edition_number" class="form-control" value="3" min="1" id="field-edition_number">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="field-type">Tipo do Evento *</label>
                <select name="type" class="form-control" id="field-type">
                    <option value="TRILHAO">Trilhão Off-Road (1 Dia)</option>
                    <option value="EXPEDITION">Expedição (Múltiplos Dias)</option>
                    <option value="ENCOUNTER">Encontro / Passeio Off-Road</option>
                </select>
            </div>
            <div class="form-group">
                <label class="form-label" for="field-max_attendees">Capacidade Máxima de Pilotos *</label>
                <input type="number" name="max_attendees" class="form-control" value="300" min="10" id="field-max_attendees">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="field-venue">Local de Concentração *</label>
                <input type="text" name="venue" class="form-control" required value="Polo de Lazer de Tianguá" id="field-venue">
            </div>
            <div class="form-group">
                <label class="form-label" for="field-city">Cidade / UF *</label>
                <input type="text" name="city" class="form-control" required value="Tianguá" id="field-city">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="field-starts_at">Data e Hora de Início *</label>
                <input type="datetime-local" name="starts_at" class="form-control" required id="field-starts_at">
            </div>
            <div class="form-group">
                <label class="form-label" for="field-ends_at">Data e Hora de Término *</label>
                <input type="datetime-local" name="ends_at" class="form-control" required id="field-ends_at">
            </div>
        </div>

        <div class="form-grid">
            <div class="form-group">
                <label class="form-label" for="field-registration_opens_at">Abertura das Inscrições *</label>
                <input type="datetime-local" name="registration_opens_at" class="form-control" required id="field-registration_opens_at">
            </div>
            <div class="form-group">
                <label class="form-label" for="field-registration_closes_at">Encerramento das Inscrições *</label>
                <input type="datetime-local" name="registration_closes_at" class="form-control" required id="field-registration_closes_at">
            </div>
        </div>

        <div class="form-group">
            <label class="form-label" for="field-description">Apresentação / Descrição do Evento</label>
            <textarea name="description" class="form-control" rows="4" placeholder="Detalhes, percurso e atrações..." id="field-description"></textarea>
        </div>

        <div class="mg-form-actions mg-space-top">
            <a href="{% url 'gestao:event_list' %}" class="btn btn-secondary">Cancelar</a>
            <button type="submit" class="btn btn-primary btn-lg">Salvar e Criar Estrutura</button>
        </div>
    </form>
</div>
{% endblock %}
