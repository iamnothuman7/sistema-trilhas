<div class="form-group">
  <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %} <span aria-hidden="true">*</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<small class="form-help" id="{{ field.id_for_label }}_helptext">{{ field.help_text }}</small>{% endif %}
  {% if field.errors %}<div class="mg-field-errors" role="alert">{{ field.errors }}</div>{% endif %}
</div>
