<style>
.payment-page{max-width:1120px;margin:0 auto;padding:clamp(40px,6vw,72px) 24px 80px;color:var(--text-main,#202221);font-family:'Poppins',sans-serif;font-size:16px;line-height:1.7}
.payment-page *, .payment-page *::before, .payment-page *::after{box-sizing:border-box;min-width:0}
.payment-page h1{font-family:'Quicksand','Poppins',sans-serif;font-size:clamp(30px,4vw,44px);font-weight:700;line-height:1.16;letter-spacing:-.035em;margin:12px 0 20px;color:var(--text-main,#202221);overflow-wrap:anywhere}
.payment-page h2{font-size:21px;line-height:1.35;font-weight:600;margin:0 0 16px;color:var(--text-main,#202221)}
.payment-page p{line-height:1.7;margin:0 0 20px}.payment-page :focus-visible{outline:3px solid var(--primary,#f97316);outline-offset:4px}
.payment-kicker{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:#b3480b}
.payment-muted{color:var(--text-muted,#68716c)}
.payment-layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;margin-top:40px;align-items:start}
.payment-card{background:var(--bg-card,#fff);border:1px solid var(--border,#e4e6e1);border-radius:24px;padding:32px;margin-bottom:24px;box-shadow:0 6px 24px rgb(32 34 33 / 3%)}
.payment-card>:last-child{margin-bottom:0}.payment-card h2{display:flex;gap:12px;align-items:center}.payment-card svg{width:22px;height:22px;flex-shrink:0}
.payment-total{display:flex;align-items:center;justify-content:space-between;gap:24px;border-top:1px solid var(--border,#e4e6e1);margin:24px 0;padding-top:24px}.payment-total strong{font-size:26px;line-height:1.3;white-space:nowrap}
.payment-list{list-style:none;padding:0;margin:0}.payment-list li{padding:20px 0;border-bottom:1px solid var(--border,#e4e6e1)}.payment-list li:last-child{border:0}.payment-list small{display:block;margin-top:6px;font-size:14px;line-height:1.6}
.payment-button{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:52px;padding:14px 24px;border-radius:999px;border:1px solid transparent;background:var(--primary,#f97316);color:#291a0d;font:inherit;font-size:15px;line-height:1.45;font-weight:600;cursor:pointer;text-decoration:none;text-align:center;transition:background .2s ease}
.payment-button:hover{background:#fb923c;color:#291a0d}.payment-button:disabled{opacity:.55;cursor:not-allowed}.payment-button-secondary{background:var(--surface,#fff);color:var(--text-main,#202221);border-color:var(--border,#e4e6e1)}.payment-button-secondary:hover{background:var(--surface-hover,#f4f3ef);color:var(--text-main,#202221)}.payment-full{width:100%}
.payment-form{display:grid;gap:24px}.payment-field label,.payment-page .form-label{display:block;margin-bottom:9px;font-size:14px;line-height:1.5;font-weight:600;color:var(--text-main,#202221)}
.payment-field input,.payment-field select,.payment-secure-field,.payment-page .form-control{width:100%;min-height:52px;border:1px solid var(--border,#e4e6e1);border-radius:12px;background:var(--surface,#fff);color:var(--text-main,#202221);padding:14px 16px;font:inherit;font-size:16px;line-height:1.4;box-shadow:none}
.payment-field input:focus,.payment-field select:focus,.payment-page .form-control:focus{border-color:var(--primary,#f97316)}.payment-field input[readonly]{background:var(--surface-hover,#f4f3ef)}
.payment-secure-field{height:52px;padding:0 16px;display:flex;align-items:center}.payment-secure-field iframe{height:100%;width:100%}
.payment-form-row{display:grid;grid-template-columns:1fr 1fr;gap:24px}.payment-alert{padding:20px 24px;background:var(--surface-hover,#f4f3ef);border:1px solid var(--border,#e4e6e1);border-radius:16px;line-height:1.7;margin:24px 0}.payment-alert[role=alert]{border-color:#f4ba97;background:#fff7ef}
.payment-status-icon{display:inline-flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:20px;background:#fff0e4;color:#b3480b;margin-bottom:12px}.payment-status-icon svg{width:30px;height:30px}
.payment-qr{display:block;width:264px;max-width:100%;height:auto;margin:28px auto;background:#fff;padding:12px;border-radius:16px;border:1px solid var(--border,#e4e6e1)}
.payment-copy{width:100%;resize:vertical;min-height:112px;margin:10px 0 16px;padding:16px;border:1px solid var(--border,#e4e6e1);border-radius:12px;background:var(--surface,#fff);color:var(--text-main,#202221);font:inherit;font-size:14px;line-height:1.6;overflow-wrap:anywhere}
.payment-centered{max-width:720px;margin:0 auto;text-align:center}.payment-centered>.payment-card{margin-top:32px}.payment-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:16px;margin-top:32px}.payment-reference{font-family:monospace;overflow-wrap:anywhere}.payment-help{font-size:14px;margin-top:20px!important}.payment-help svg{width:18px;height:18px;vertical-align:middle}
.payment-form [hidden],.payment-page [hidden]{display:none!important}
.registration-page{max-width:1000px}.registration-intro{max-width:740px;margin-bottom:40px}.registration-intro p{font-size:17px}.registration-page .card-header{display:flex;align-items:flex-start;justify-content:space-between;flex-wrap:wrap;gap:20px;padding:0 0 24px;margin-bottom:24px;border-bottom:1px solid var(--border,#e4e6e1)}
.registration-page .card-header h2{margin-bottom:8px}.registration-caption{font-size:14px;color:var(--text-muted,#68716c)}.registration-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.registration-wide{grid-column:1/-1}.registration-page .form-group{margin:0}
.registration-page .participant-item{padding:28px;border-radius:20px;background:var(--surface-hover,#f4f3ef);box-shadow:none;margin-bottom:24px!important}.registration-page .participant-item:last-child{margin-bottom:0!important}.registration-page .participant-item>div[style*="grid-template-columns"]{gap:24px!important;margin-top:24px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))!important}
.registration-page .participant-item .form-control{background:var(--surface,#fff)}.registration-page .participant-item .btn{min-height:44px}.registration-submit{width:100%;margin-top:8px}.registration-coupon{max-width:420px;text-transform:uppercase}
@media(max-width:800px){.payment-layout{grid-template-columns:1fr}.payment-summary{grid-row:1}.payment-card{padding:28px}.registration-page .participant-item{padding:24px}.payment-page h1{font-size:clamp(28px,6vw,36px)}}
@media(max-width:560px){.payment-page{padding:36px 16px 56px}.payment-card{padding:28px 20px}.payment-form-row,.registration-grid{grid-template-columns:1fr}.registration-page .participant-item>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}.registration-page .participant-item{padding:24px 16px}.registration-page .card-header .payment-button{width:100%}.payment-total{gap:12px;flex-wrap:wrap}.payment-actions>.payment-button{width:100%}.payment-total strong{font-size:24px}}
</style>
